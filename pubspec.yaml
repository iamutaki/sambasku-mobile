name: sambasku_mobile
description: "Kamus Digital Sambas-Indonesia (Mobile)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  envied: ^1.3.5
  gap: ^3.0.1
  forui: ^0.22.3
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  go_router: ^17.3.0
  dio: ^5.9.2
  retrofit: ^4.9.2
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0-beta.4
  flutter_hooks: ^0.21.3
  forui_hooks: ^0.22.1
  riverpod_annotation: ^4.0.2
  fpdart: ^1.1.0
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3
  permission_handler: ^13.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  awesome_notifications: ^0.10.1
  flutter_udid: ^4.1.2
  share_plus: ^13.3.0
  google_fonts: ^6.3.2
  gal: ^2.3.2
  video_player: ^2.10.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0
  record: ^6.0.0
  just_audio: ^0.9.46

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  freezed: ^3.2.5
  retrofit_generator: ^10.2.6
  riverpod_generator: ^4.0.3
  envied_generator: ^1.3.5
  flutter_flavorizr: ^2.5.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_foreground: "assets/icons/logo.png"
  adaptive_icon_background: "#FFFFFF"

flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
    ios:
      bundleId: "com.iamutaki.sambasku"
  flavors:
    staging:
      app:
        name: "SambasKu Staging"
        icon: "assets/icons/logo.staging.png"
      android:
        applicationId: "com.iamutaki.sambasku.staging"
        firebase:
          config: "flavorizr/firebase/staging/google-services.json"
      ios:
        bundleId: "com.iamutaki.sambasku.staging"
    production:
      app:
        name: "SambasKu"
        icon: "assets/icons/logo.png"
      android:
        applicationId: "com.iamutaki.sambasku"
        firebase:
          config: "flavorizr/firebase/production/google-services.json"
      ios:
        bundleId: "com.iamutaki.sambasku"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
