name: Deploy (Production)

# Build flavor `production` → draft ke track production.
# Rollout tetap manual di Play Console (draft, bukan auto-publish).
# Track internal diisi workflow deploy-staging.yml dari branch staging.
# Trigger: push tag semver saja, misalnya v0.1.1.
# Nama rilis "SambasKu (Staging) v0.1.2" dan tag staging-v* tidak cocok.
#
# versionCode = 1 + versionCode tertinggi yang sudah ada di package Play
# yang sama (semua track, termasuk draft). Staging dan production berbagi
# satu deret. Job build-and-release mengantri di group yang sama supaya
# dua workflow tidak mengambil angka yang sama.
#
# Secrets GitHub (Settings → Secrets → Actions):
#   KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#   PLAY_STORE_SERVICE_ACCOUNT_JSON  - JSON service account Play Developer API
#     (lihat docs/env/google_play_console/credential.md)
#
# Host API: env.g.dart → https://api.sambasku.com

on:
  push:
    tags:
      # v0.1.1 - bukan "SambasKu (Staging) v0.1.2" dan bukan staging-v*
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  FLAVOR: production
  FLUTTER_VERSION: "3.44.1"
  PLAY_PACKAGE_NAME: com.iamutaki.sambasku

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test Play version-code resolver
        run: node --test scripts/next-play-version-code.test.mjs

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: play-com.iamutaki.sambasku
      cancel-in-progress: false

    steps:
      - name: Require production semver tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "tag harus berbentuk v0.1.1, dapat: $TAG" >&2; exit 1; }
          case "$TAG" in
            *Staging*|*staging*)
              echo "tag staging tidak masuk track production: $TAG" >&2
              exit 1
              ;;
          esac
          echo "Production tag: $TAG"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore & write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Resolve production version (tag name + Play versionCode)
        id: version
        # versionName dari tag (v0.1.1 -> 0.1.1). versionCode dari Play.
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          printf '%s\n' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "invalid version name from tag: '$TAG'" >&2; exit 1; }
          N=$(node scripts/next-play-version-code.mjs)
          case "$N" in
            ''|*[!0-9]*) echo "invalid version code: '$N'" >&2; exit 1 ;;
          esac
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${N}"    >> "$GITHUB_OUTPUT"
          echo "Production version: ${NAME}+${N}"

      - name: Write resolved version into pubspec.yaml
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          sed -i "s|^version:.*|version: ${VERSION_NAME}+${VERSION_CODE}|" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      # - name: Build release APKs (GitHub Release / sideload)
      #   run: >
      #     flutter build apk --release --obfuscate
      #     --split-per-abi --split-debug-info=./debug-info
      #     --flavor "$FLAVOR" -t lib/main.dart

      # Play Console hanya menerima AAB untuk rilis baru.
      - name: Build App Bundle (Play Console)
        run: >
          flutter build appbundle --release --obfuscate
          --split-debug-info=./debug-info
          --flavor "$FLAVOR" -t lib/main.dart

      # - name: Upload APKs as workflow artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: production-apks
      #     path: build/app/outputs/flutter-apk/*.apk
      #     if-no-files-found: error

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-aab
          path: build/app/outputs/bundle/productionRelease/*.aab
          if-no-files-found: error

      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: v${{ steps.version.outputs.name }}
      #     name: SambasKu v${{ steps.version.outputs.name }}
      #     generate_release_notes: true
      #     files: |
      #       build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk
      #       build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk
      #       build/app/outputs/bundle/productionRelease/app-production-release.aab
      #     fail_on_unmatched_files: true
      #     make_latest: "true"

      # Draft di track production - tidak auto-publish. Rollout tetap
      # manual di Play Console.
      - name: Assert AAB has no advertising ID permission
        run: node scripts/assert-no-ad-id.mjs

      - name: Upload draft ke Google Play production
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/productionRelease/app-production-release.aab
          tracks: production
          status: draft
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
