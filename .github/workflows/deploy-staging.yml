name: Deploy (Staging)

# Build flavor `staging` → GitHub Release (bukan "latest").
# Sekaligus build flavor `production` → draft ke track internal
# app Play `com.iamutaki.sambasku` (bukan package .staging).
# Track production diisi workflow deploy-production.yml dari branch main.
# Trigger: push branch `staging` (atau workflow_dispatch).
#
# versionCode = 1 + versionCode tertinggi yang sudah ada di package Play
# yang sama (semua track, termasuk draft). Staging dan production berbagi
# satu deret. Job build-and-release mengantri di group yang sama supaya
# dua workflow tidak mengambil angka yang sama.
#
# Secrets GitHub yang DIBUTUHKAN (Settings → Secrets → Actions):
#   KEYSTORE_BASE64     - isi upload-keystore.jks di-encode base64
#   KEYSTORE_PASSWORD   - store password
#   KEY_ALIAS           - key alias
#   KEY_PASSWORD        - key password
#   PLAY_STORE_SERVICE_ACCOUNT_JSON  - JSON service account Play Developer API
#     (lihat docs/env/google_play_console/credential.md)
#
# One-time keystore (lokal, jangan commit):
#   keytool -genkey -v -keystore upload-keystore.jks \
#     -keyalg RSA -keysize 2048 -validity 10000 -alias upload
#   base64 -i upload-keystore.jks | pbcopy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

env:
  FLAVOR: staging
  FLUTTER_VERSION: "3.44.1"
  PLAY_PACKAGE_NAME: com.iamutaki.sambasku

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test Play version-code resolver
        run: node --test scripts/next-play-version-code.test.mjs

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: play-com.iamutaki.sambasku
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode keystore & write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Resolve staging version (Play versionCode + 1)
        id: version
        # major.minor dari pubspec.yaml. versionCode dari Play, bukan git.
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME }}
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          MAJOR_MINOR=$(printf '%s' "$BASE" | awk -F. '{print $1"."$2}')
          N=$(node scripts/next-play-version-code.mjs)
          case "$N" in
            ''|*[!0-9]*) echo "invalid version code: '$N'" >&2; exit 1 ;;
          esac
          echo "name=${MAJOR_MINOR}.${N}" >> "$GITHUB_OUTPUT"
          echo "code=${N}"              >> "$GITHUB_OUTPUT"
          echo "Staging version: ${MAJOR_MINOR}.${N}+${N}"

      - name: Write resolved version into pubspec.yaml
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          sed -i "s|^version:.*|version: ${VERSION_NAME}+${VERSION_CODE}|" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build release APKs (staging, split per ABI)
        run: >
          flutter build apk --release --obfuscate
          --split-per-abi --split-debug-info=./debug-info
          --flavor "$FLAVOR" -t lib/main.dart

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Hanya ARM ke GitHub Release (HP nyata). x86_64 tetap di artifact
      # (emulator); upload file besar sering bikin GitHub Unicorn/500.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-v${{ steps.version.outputs.name }}
          name: SambasKu (Staging) v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-staging-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-staging-release.apk
          fail_on_unmatched_files: true
          make_latest: "false"

      # AAB flavor production (package Play), bukan flavor staging.
      # Map obfuscation dipisah supaya tidak menimpa simbol APK staging.
      - name: Build App Bundle (Play internal testing)
        run: >
          flutter build appbundle --release --obfuscate
          --split-debug-info=./debug-info-production
          --flavor production -t lib/main.dart

      - name: Upload Play AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-play-aab
          path: build/app/outputs/bundle/productionRelease/*.aab
          if-no-files-found: error

      # Draft di internal testing — tidak auto-publish. Track production
      # diisi workflow deploy-production.yml.
      - name: Assert AAB has no advertising ID permission
        run: node scripts/assert-no-ad-id.mjs

      - name: Upload draft ke Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/productionRelease/app-production-release.aab
          tracks: internal
          status: draft
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
